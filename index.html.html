<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Owner Book</title>
<style>
:root{--bg:#f4f6f8;--card:#fff;--text:#1b2733;--muted:#66788a;--accent:#1f4e78;--line:#dde3e9;--ok:#1b7f4b}
@media (prefers-color-scheme:dark){:root{--bg:#10171e;--card:#18222c;--text:#e8eef3;--muted:#8fa3b5;--accent:#5aa2e0;--line:#2a3846;--ok:#4cc28a}}
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--text);padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.wrap{max-width:720px;margin:0 auto;padding:12px}
h1{font-size:18px;margin:6px 0 10px}
input,select,button,textarea{font:inherit;color:var(--text)}
input,select,textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--card)}
button{padding:9px 12px;border:0;border-radius:8px;background:var(--accent);color:#fff;cursor:pointer}
button.ghost{background:transparent;color:var(--accent);border:1px solid var(--accent)}
.row{display:flex;gap:8px;margin-bottom:8px}
.row>*{flex:1}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}
.name{font-weight:bold;font-size:15px}
.sub{color:var(--muted);font-size:13px;margin:2px 0 6px}
.badge{display:inline-block;font-size:12px;padding:2px 8px;border-radius:99px;background:var(--line);margin-right:4px}
.tip{font-size:12px;color:var(--muted);margin:6px 0}
.phone{display:flex;align-items:center;gap:6px;margin:6px 0;flex-wrap:wrap}
.phone b{min-width:110px}
.phone a{padding:6px 10px;border-radius:8px;background:var(--accent);color:#fff;text-decoration:none;font-size:13px}
.phone a.wa{background:var(--ok)}
.maplink{font-size:13px;color:var(--accent)}
.msg{color:var(--muted);font-size:13px;padding:8px 0}
.err{color:#c0392b;font-size:13px}
.pager{display:flex;gap:8px;justify-content:space-between;align-items:center;margin:10px 0}
label.chk{display:flex;gap:8px;align-items:center;font-size:14px;margin-bottom:8px}
label.chk input{width:auto}
</style>
</head>
<body>
<div class="wrap">

<div id="login" hidden>
  <h1>Owner Book</h1>
  <div class="card">
    <input id="email" type="email" placeholder="Email" autocomplete="username" style="margin-bottom:8px">
    <input id="pw" type="password" placeholder="Password" autocomplete="current-password" style="margin-bottom:8px">
    <button id="loginBtn" style="width:100%">Login</button>
    <div id="loginErr" class="err"></div>
  </div>
</div>

<div id="app" hidden>
  <div class="row" style="align-items:center">
    <h1 style="flex:3">Owner Book</h1>
    <button class="ghost" id="logoutBtn" style="flex:1">Logout</button>
  </div>
  <input id="q" placeholder="Search: name / road / unit / phone" style="margin-bottom:8px">
  <div class="row">
    <select id="area"><option value="">All areas</option></select>
    <select id="road"><option value="">All roads</option></select>
  </div>
  <div class="row">
    <select id="age">
      <option value="">All ages</option>
      <option value="0-34">Under 35</option>
      <option value="35-49">35 – 49</option>
      <option value="50-64">50 – 64</option>
      <option value="65-120">65 and above</option>
    </select>
  </div>
  <div class="row">
    <select id="status">
      <option value="">All status</option>
      <option value="new">New (not contacted)</option>
      <option value="no_answer">No answer</option>
      <option value="is_owner">Confirmed owner</option>
      <option value="wants_sell">Wants to sell</option>
      <option value="wants_rent">Wants to rent</option>
      <option value="not_interested">Not interested</option>
      <option value="wrong_number">Wrong number</option>
    </select>
    <button id="goBtn">Search</button>
  </div>
  <label class="chk"><input type="checkbox" id="onlyPhone" checked> Only with phone</label>
  <div id="info" class="msg"></div>
  <div id="list"></div>
  <div class="pager">
    <button class="ghost" id="prevBtn">Previous</button>
    <span id="pageInfo" class="msg"></span>
    <button class="ghost" id="nextBtn">Next</button>
  </div>
</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.58.0/dist/umd/supabase.js"></script>
<script>
// ====== 1) Paste your own Supabase values here (Project Settings > API) ======
const SUPABASE_URL = 'https://zaynmrfpivvifkvwfzuz.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_m5FwL0mHgjFSAxYDQe2f1w_4bNtHXpb';
// ============================================================================

const PAGE = 30;
let page = 0, total = 0;
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const $ = id => document.getElementById(id);

const STATUS = {
  new: 'New', no_answer: 'No answer', is_owner: 'Confirmed owner', wants_sell: 'Wants to sell',
  wants_rent: 'Wants to rent', not_interested: 'Not interested', wrong_number: 'Wrong number'
};

function areaLabel(a) { return a === '未分区' ? 'Unassigned' : a; }
function pad(n) { return String(n).padStart(2, '0'); }
function todayLocal() { const t = new Date(); return t.getFullYear() + '-' + pad(t.getMonth() + 1) + '-' + pad(t.getDate()); }
function fmtDate(iso) { if (!iso) return ''; const p = String(iso).split('-'); return p[2] + '/' + p[1] + '/' + p[0].slice(2); }
function normPhone(s) {
  let d = String(s || '').replace(/\D/g, '');
  if (!d) return '';
  if (d.startsWith('60')) d = '0' + d.slice(2);
  if (!d.startsWith('0')) d = '0' + d;
  return d;
}
function ageOf(by) { return by ? new Date().getFullYear() - by : null; }
function ageGroup(a) {
  if (a === null) return null;
  if (a < 35) return 'Under 35';
  if (a < 50) return '35 – 49';
  if (a < 65) return '50 – 64';
  return '65 and above';
}
function tip(a) {
  if (a === null) return 'No age info. Start by confirming they are the owner.';
  if (a < 35) return 'Tip: WhatsApp first, one short line, add rent or sold-price figures.';
  if (a < 50) return 'Tip: talk rental return, appreciation and timing; book a time for a call.';
  if (a < 65) return 'Tip: build trust first, use concrete numbers, offer to meet.';
  return 'Tip: call rather than text, speak slowly and respectfully, no pressure; welcome family to join.';
}
function waLink(p) {
  let d = String(p).replace(/\D/g, '');
  if (d.startsWith('0')) d = '6' + d;
  return 'https://wa.me/' + d;
}
function expandRoad(s) {
  const M = { lrg: 'Lorong', jln: 'Jalan', psrn: 'Persiaran', tmn: 'Taman' };
  return String(s || '').split(/\s+/).map(w => M[w.toLowerCase()] || w).join(' ');
}
function mapLink(o) {
  const base = 'https://www.google.com/maps/search/?api=1&query=';
  if (o.lat != null && o.lng != null) return base + o.lat + ',' + o.lng;
  const unit = String(o.unit || '').replace(/^no\.?\s*/i, '').trim();
  const area = (o.area_status === 'confirmed' && o.area !== '未分区') ? o.area : '';
  const q = [unit !== '-' ? unit : '', expandRoad(o.road), area, '41200 Klang, Selangor'].filter(Boolean).join(', ');
  return base + encodeURIComponent(q);
}
function el(tag, props, children) {
  const e = document.createElement(tag);
  Object.assign(e, props || {});
  (children || []).forEach(c => e.append(c));
  return e;
}

async function showApp(on) {
  $('login').hidden = on;
  $('app').hidden = !on;
  if (on) { await loadRoads(); await search(0); }
}

async function loadRoads() {
  const { data, error } = await sb.rpc('road_counts');
  if (error || !data) return;
  const sel = $('road'), asel = $('area');
  sel.length = 1; asel.length = 1;
  const areas = new Set();
  data.forEach(r => {
    if (!r.road) return;
    if (r.area) areas.add(r.area);
    sel.append(el('option', { value: r.road, textContent: r.road + ' · ' + (r.area || '') + '  (' + r.n + ' / phones ' + r.with_phone + ')' }));
  });
  [...areas].sort().forEach(a => asel.append(el('option', { value: a, textContent: areaLabel(a) })));
}

async function search(p) {
  page = p;
  $('info').textContent = 'Searching…';
  const cols = 'id,owner_name,unit,road,area,area_status,phone1,phone2,phone3,premise,birth_year,last_contacted,status,notes,new_phone1,new_phone1_date,new_phone2,new_phone2_date,lat,lng,pinned_at';
  let q = sb.from('owners').select(cols, { count: 'exact' });
  const ALIAS = { lorong: 'lrg', lrg: 'lorong', jalan: 'jln', jln: 'jalan', persiaran: 'psrn', psrn: 'persiaran', taman: 'tmn', tmn: 'taman' };
  const words = $('q').value.replace(/[,()%*\\]/g, ' ').toLowerCase().split(/\s+/).filter(Boolean);
  const hasDigit = s => /\d/.test(s);
  words.forEach((raw, i) => {
    const w = raw.replace(/\.$/, '');
    if (!w) return;
    if (w === 'no' && words[i + 1] && hasDigit(words[i + 1])) return;
    const d = w.replace(/-/g, '');
    const conds = [];
    if (/^\d{7,}$/.test(d)) {
      ['phone1', 'phone2', 'phone3', 'new_phone1', 'new_phone2'].forEach(c => conds.push(c + '.ilike.%' + d + '%'));
    } else if (/^\d+$/.test(w)) {
      conds.push('unit.ilike.' + w, 'unit.ilike.no ' + w, 'road.ilike.% ' + w, 'road.ilike.% ' + w + ' %');
    } else if (hasDigit(w)) {
      conds.push('unit.ilike.' + w, 'unit.ilike.no ' + w, 'road.ilike.%' + w + '%', 'premise.ilike.%' + w + '%');
    } else {
      const variants = ALIAS[w] ? [w, ALIAS[w]] : [w];
      variants.forEach(v => ['owner_name', 'road', 'unit', 'premise'].forEach(c => conds.push(c + '.ilike.%' + v + '%')));
    }
    q = q.or(conds.join(','));
  });
  if ($('area').value) q = q.eq('area', $('area').value);
  if ($('road').value) q = q.eq('road', $('road').value);
  if ($('onlyPhone').checked) q = q.or('has_phone.eq.true,new_phone1.not.is.null,new_phone2.not.is.null');
  if ($('status').value) q = q.eq('status', $('status').value);
  if ($('age').value) {
    const [lo, hi] = $('age').value.split('-').map(Number);
    const y = new Date().getFullYear();
    q = q.gte('birth_year', y - hi).lte('birth_year', y - lo);
  }
  q = q.order('area').order('road').order('unit').range(p * PAGE, p * PAGE + PAGE - 1);
  const { data, error, count } = await q;
  if (error) { $('info').textContent = 'Error: ' + error.message; return; }
  total = count || 0;
  $('info').textContent = total + ' owners';
  const pages = Math.max(1, Math.ceil(total / PAGE));
  $('pageInfo').textContent = (page + 1) + ' / ' + pages;
  $('prevBtn').disabled = page === 0;
  $('nextBtn').disabled = page + 1 >= pages;
  const list = $('list');
  list.replaceChildren();
  data.forEach(o => list.append(card(o)));
  window.scrollTo(0, 0);
}

function card(o) {
  const a = ageOf(o.birth_year);
  const c = el('div', { className: 'card' });
  c.append(el('div', { className: 'name', textContent: o.owner_name || '(no name)' }));
  c.append(el('div', { className: 'sub', textContent: [o.unit, o.road].filter(Boolean).join(' · ') + (o.premise ? ' · ' + o.premise : '') }));
  const badges = el('div');
  badges.append(el('span', { className: 'badge', textContent: a !== null ? '~' + a + ' yrs · ' + ageGroup(a) : 'Age unknown' }));
  badges.append(el('span', { className: 'badge', textContent: areaLabel(o.area || '未分区') + (o.area_status === 'to_confirm' ? ' (to confirm)' : '') }));
  badges.append(el('span', { className: 'badge', textContent: STATUS[o.status] || o.status || 'new' }));
  if (o.last_contacted) badges.append(el('span', { className: 'badge', textContent: 'Last: ' + o.last_contacted }));
  c.append(badges);
  c.append(el('div', { className: 'tip', textContent: tip(a) }));

  [o.phone1, o.phone2, o.phone3].filter(Boolean).forEach(p => {
    const row = el('div', { className: 'phone' });
    row.append(el('b', { textContent: p }));
    row.append(el('a', { href: 'tel:' + p, textContent: 'Call' }));
    const w = el('a', { href: waLink(p), textContent: 'WhatsApp', className: 'wa' });
    w.target = '_blank'; w.rel = 'noopener';
    row.append(w);
    c.append(row);
  });

  const slotsBox = el('div');
  const btnStyle = 'padding:4px 8px;font-size:12px';
  const addBtn = el('button', { className: 'ghost', textContent: 'Add new number', style: btnStyle + ';margin-top:4px' });
  const setSlot = async (n, v) => {
    const payload = {};
    payload['new_phone' + n] = v;
    payload['new_phone' + n + '_date'] = v ? todayLocal() : null;
    const { error } = await sb.from('owners').update(payload).eq('id', o.id);
    if (error) { alert('Failed: ' + error.message); return; }
    Object.assign(o, payload);
    renderSlots();
  };
  const saveSlot = (n, input) => {
    if (input === null) return;
    const v = normPhone(input);
    if (!v) return;
    if (v.length !== 10 && v.length !== 11 && !confirm(v + ' has ' + v.length + ' digits. Save anyway?')) return;
    setSlot(n, v);
  };
  const slotRow = n => {
    const num = o['new_phone' + n];
    if (!num) return null;
    const row = el('div', { className: 'phone' });
    row.append(el('b', { textContent: num + ' · ' + fmtDate(o['new_phone' + n + '_date']) }));
    row.append(el('a', { href: 'tel:' + num, textContent: 'Call' }));
    const wa = el('a', { href: waLink(num), textContent: 'WhatsApp', className: 'wa' });
    wa.target = '_blank'; wa.rel = 'noopener';
    row.append(wa);
    const ed = el('button', { className: 'ghost', textContent: 'Edit', style: btnStyle });
    ed.onclick = () => saveSlot(n, prompt('Edit number', num));
    const de = el('button', { className: 'ghost', textContent: 'Delete', style: btnStyle });
    de.onclick = () => { if (confirm('Delete ' + num + '?')) setSlot(n, null); };
    row.append(ed, de);
    return row;
  };
  const renderSlots = () => {
    slotsBox.replaceChildren();
    [1, 2].forEach(n => { const r = slotRow(n); if (r) slotsBox.append(r); });
    slotsBox.append(addBtn);
  };
  addBtn.onclick = () => {
    const n = !o.new_phone1 ? 1 : (!o.new_phone2 ? 2 : 0);
    if (!n) { alert('Both new-number slots are full. Delete one first.'); return; }
    saveSlot(n, prompt('New number (e.g. 017-3751728)', ''));
  };
  renderSlots();
  c.append(slotsBox);

  const m = el('a', { href: mapLink(o), textContent: 'Open in Google Maps', className: 'maplink' });
  m.target = '_blank'; m.rel = 'noopener';
  c.append(m);
  const pinBtn = el('button', { className: 'ghost', style: 'margin-left:8px;padding:4px 8px;font-size:12px' });
  const refreshMap = () => {
    m.href = mapLink(o);
    m.textContent = o.lat != null ? 'Open pin in Google Maps' : 'Open in Google Maps';
    pinBtn.textContent = o.lat != null ? 'Re-pin here (' + fmtDate(o.pinned_at) + ')' : 'Pin here';
  };
  pinBtn.onclick = () => {
    if (!navigator.geolocation) { alert('Location is not available on this device.'); return; }
    navigator.geolocation.getCurrentPosition(async pos => {
      const acc = Math.round(pos.coords.accuracy);
      if (!confirm('Save your current location as this unit pin? Accuracy about ' + acc + ' m. Stand in front of the unit.')) return;
      const payload = { lat: pos.coords.latitude, lng: pos.coords.longitude, pinned_at: todayLocal() };
      let uq = sb.from('owners').update(payload);
      uq = (o.unit && o.unit !== '-') ? uq.eq('road', o.road).eq('unit', o.unit) : uq.eq('id', o.id);
      const { error } = await uq;
      if (error) { alert('Failed: ' + error.message); return; }
      Object.assign(o, payload);
      refreshMap();
    }, err => alert('Could not get location: ' + err.message), { enableHighAccuracy: true, timeout: 15000 });
  };
  refreshMap();
  c.append(pinBtn);
  const chg = el('button', { className: 'ghost', textContent: 'Change area of this road', style: 'margin-left:8px;padding:4px 8px;font-size:12px' });
  chg.onclick = async () => {
    const n = prompt('Which area does this road (' + o.road + ') belong to?', o.area || '');
    if (!n) return;
    const { error } = await sb.rpc('set_road_area', { p_road: o.road, p_area: n.trim() });
    if (error) { alert('Failed: ' + error.message); return; }
    await loadRoads(); search(page);
  };
  c.append(chg);

  const st = el('select');
  Object.keys(STATUS).forEach(k => st.append(el('option', { value: k, textContent: STATUS[k], selected: k === (o.status || 'new') })));
  const note = el('textarea', { rows: 2, placeholder: 'Notes', value: o.notes || '' });
  const save = el('button', { textContent: 'Save & mark contacted today' });
  const done = el('span', { className: 'msg' });
  save.onclick = async () => {
    const today = todayLocal();
    const { error } = await sb.from('owners').update({ status: st.value, notes: note.value, last_contacted: today }).eq('id', o.id);
    done.textContent = error ? 'Save failed: ' + error.message : 'Saved ' + today;
  };
  const box = el('div', { style: 'margin-top:10px' }, [st, el('div', { style: 'height:6px' }), note, el('div', { style: 'height:6px' }), save, done]);
  c.append(box);
  return c;
}

$('loginBtn').onclick = async () => {
  $('loginErr').textContent = '';
  const { error } = await sb.auth.signInWithPassword({ email: $('email').value.trim(), password: $('pw').value });
  if (error) { $('loginErr').textContent = error.message; return; }
  showApp(true);
};
$('logoutBtn').onclick = async () => { await sb.auth.signOut(); showApp(false); };
$('goBtn').onclick = () => search(0);
$('q').addEventListener('keydown', e => { if (e.key === 'Enter') search(0); });
$('prevBtn').onclick = () => search(Math.max(0, page - 1));
$('nextBtn').onclick = () => search(page + 1);

(async () => {
  const { data } = await sb.auth.getSession();
  showApp(!!(data && data.session));
})();
</script>
</body>
</html>
